name: deploy this gay ass app to gh pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Enforce Bun :D
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ] || [ -f "pnpm-lock.yaml" ]; then
            echo "only bun is allowed"
            exit 1
          fi

          if [ ! -f "bun.lock" ]; then
            echo "bun.lock missing"
            exit 1
          fi

          echo "=== BUN PRESENT ==="

      - name: Fetch Public URL from Secrets
        run: |
          if [ -z "${{ secrets.CLOUD_RUN_SERVICE_URL }}" ]; then
            echo "CLOUD_RUN_SERVICE_URL secret is missing!" >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_BASE_URL=${{ secrets.CLOUD_RUN_SERVICE_URL }}" >> $GITHUB_ENV

      - name: Setup Page
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with Next.js
        env:
          OUTPUT_EXPORT: 1
        run: |
          echo "Building Next.js static export"
          bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploying to pages..
        id: deployment
        uses: actions/deploy-pages@v4